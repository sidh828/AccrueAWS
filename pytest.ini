[pytest]
# tests/ has no __init__.py, so pytest's default import mode doesn't put the
# repo root on sys.path - only `tests/` itself. Without this, `from src import
# ...` only resolves when invoked as `python -m pytest` (which adds the cwd to
# sys.path itself); a bare `pytest` invocation - what CI actually runs -
# fails with ModuleNotFoundError: No module named 'src'.
pythonpath = .
